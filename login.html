<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        gpt: {
                            main: '#0A0A0A',
                            surface: '#1A1A1A',
                            text: '#F5F5F5',
                            muted: '#9CA3AF',
                            accent: '#10A37F' /* ChatGPT Green */
                        }
                    }
                }
            }
        }
    </script>
    <title>Log in - Rudee AI</title>
</head>
<body class="bg-gpt-main text-gpt-text font-sans h-screen flex flex-col items-center justify-center selection:bg-gpt-accent/30">

    <div class="w-full max-w-[400px] p-6 flex flex-col items-center animate-fade-in">
        
        <div class="mb-10 text-center">
            <img src="./Logo.png" alt="Rudee" class="w-12 h-12 mx-auto mb-6">
            <h1 class="text-3xl font-bold text-white tracking-tight">Welcome back</h1>
        </div>

        <form id="login-form" class="w-full space-y-4">
            
            <div id="error-message" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-md text-sm text-center"></div>

            <div class="space-y-2">
                <label class="text-[14px] font-medium text-gpt-text">Email address</label>
                <input type="email" id="email" class="w-full bg-gpt-main border border-gray-600 rounded-md py-3 px-4 text-gpt-text focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-colors" required>
            </div>

            <div class="space-y-2 pb-2">
                <label class="text-[14px] font-medium text-gpt-text">Password</label>
                <input type="password" id="password" class="w-full bg-gpt-main border border-gray-600 rounded-md py-3 px-4 text-gpt-text focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-colors" required>
            </div>

            <button type="submit" class="w-full bg-gpt-accent hover:bg-[#0E906F] text-white font-medium py-3 rounded-md transition-colors">
                Continue
            </button>
        </form>

        <div class="mt-6 text-center text-[14px]">
            <p class="text-gpt-muted">Don't have an account? <a href="signup.html" class="text-gpt-accent hover:underline">Sign up</a></p>
        </div>
        
        <div class="mt-8 text-center">
            <a href="index.html" class="text-sm text-gpt-muted hover:text-white transition-colors">Return to chat</a>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            const result = window.auth.login(email, password);
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                errorDiv.textContent = result.message;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</body>
</html>
